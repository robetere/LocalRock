name: Camera C0.1 Android baseline

on:
  push:
    branches: [feature/camera-support]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Set up Android SDK tools and platform
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Verify Android SDK tools
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            log="$RUNNER_TEMP/camera-gradle-$attempt.log"
            if bash ./gradlew --no-daemon --no-configuration-cache --max-workers=2 :composeApp:testDebugUnitTest :composeApp:assembleDebug 2>&1 | tee "$log"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eqi 'status code (429|5[0-9][0-9])|Too Many Requests|Connection reset|Read timed out' "$log"; then
              exit 1
            fi
            echo "Transient download failure; retrying after backoff."
            sleep "$((attempt * 30))"
          done
          exit 1
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-c01-unit-tests
          path: |
            composeApp/build/test-results/
            composeApp/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: camera-c01-android-${{ github.sha }}
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
